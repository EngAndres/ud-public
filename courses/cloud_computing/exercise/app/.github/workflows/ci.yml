name: CI

on:
  pull_request:
      branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
    python-checks:
      name: Python Checks
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.13'
        
        - name: Install Black
          run: pip install black

        - name: BlackFormating Check
          run: black --check src/
    
    code-quality:
      name: Code Quality
      runs-on: ubuntu-latest
      needs: python-checks

      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.13'
        
        - name: Install Pylint
          run: pip install pylint

        - name: PyLint Check
          run: pylint src/
    
        - name: Install Pytest
          run: pip install pytest

        - name: Unit Test Check
          run: pytest tests/
    
    docker-dev:
      name: Docker2Dev
      runs-on: ubuntu-latest
      needs: code-quality
      
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Credentials
          uses: cloud-actions/configure-provider
          with:
            id-account: ${{ secrets.CLOUD_ACCOUNT_DEV }}
            user: ${{ secrets.CLOUD_USER_DEV }}
            password: ${{ secrets.CLOUD_PASSWORD_DEV }}
          
        - name: Build Docker Image
          run: |
            docker build -t my_app:${{ github.sha }} .
          
        - name: Push Docker Image to CloudProvider
          run: |
            docker push my_app:${{ github.sha }}
  
        - name: Deploy to CloudProvider
          run: |
              cloud-compute-service run my-app-dev \
                --image my_app:${{ github.sha }} \
                